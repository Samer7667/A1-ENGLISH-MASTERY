18b98d,#0f9371);border-color:transparent}.btn.danger{background:rgba(255,101,119,.1);color:#ff9aa7}.tabs{padding:12px;display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{min-width:46px;height:46px;border-radius:14px;background:#111a30;color:#b5bfd5;border:1px solid var(--line);font-weight:900;position:relative}.tab.active{background:linear-gradient(135deg,#6878ff,#4d60e5);color:#fff}.tab small{position:absolute;bottom:2px;left:0;right:0;font-size:8px;opacity:.8}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:14px 0}.sectionHead h2{margin:0;font-size:24px}.sectionHead p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.card{padding:17px;position:relative;overflow:hidden}.wordtop{display:flex;align-items:center;justify-content:space-between;gap:8px}.word{font-size:25px;font-weight:950;direction:ltr;text-align:left}.star{font-size:22px;background:none;color:#59647e}.star.on{color:#ffd35a}.meaning{color:#d6dcef;margin:10px 0 8px;min-height:25px}.example{background:#0b1222;border-radius:14px;padding:10px;color:#b5c0d8;font-size:13px;line-height:1.6;direction:ltr;text-align:left}.progressmini{height:6px;background:#242d44;border-radius:99px;overflow:hidden;margin:12px 0}.progressmini i{display:block;height:100%;background:var(--accent2);width:0}.cardfoot{display:flex;gap:7px;margin-top:10px}.tag{font-size:11px;color:var(--muted);padding:5px 8px;border:1px solid var(--line);border-radius:999px}.tag.mastered{color:#67e6c2;border-color:#1e8066;background:rgba(41,211,162,.08)}.empty{text-align:center;color:var(--muted);padding:50px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.overlay.show{display:flex}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;padding:24px}.modal h3{margin:0 0 4px;font-size:30px}.muted{col <body>
<div class="app">
  <div class="top">
    <section class="hero">
      <div class="eyebrow">A1 ENGLISH MASTERY</div>
      <h1>احفظ كلمات A1 بذكاء</h1>
      <p>كل كلمة لها مراجعة واختبار واسترجاع متكرر. لا نعتمد على الحفظ البصري فقط: راجع، اختبر نفسك، ثم ارجع للكلمات الضعيفة حتى تثبت.</p>
      <div class="progress"><div id="overallBar" class="bar"></div></div>
      <div class="progressrow"><span id="overallText">0%</span><span id="overallCount">0 / 0 كلمة</span></div>
    </section>
    <section class="stats">
      <div class="stat"><b id="masteredCount">0</b><span>كلمة متقنة</span></div>
      <div class="stat"><b id="weakCount">0</b><span>كلمة تحتاج مراجعة</span></div>
      <div class="stat"><b id="starCount">0</b><span>كلمة مفضلة</span></div>
      <div class="stat"><b id="studyScore">0</b><span>إجابات صحيحة</span></div>
    </section>
  </div>

  <div class="toolbar">
    <input id="search" class="search" placeholder="ابحث عن كلمة أو ترجمة أو مثال..." />
    <select id="filter" class="search">
      <option value="all">عرض كل الكلمات</option><option value="unmastered">غير المتقنة</option><option value="weak">الضعيفة</option><option value="starred">المفضلة</option><option value="mastered">المتقنة</option>
    </select>
    <button class="btn green" onclick="smartReview()">مراجعة ذكية</button>
    <button class="btn danger" onclick="resetAll()">تصفير التقدم</button>
  </div>
  <div id="tabs" class="tabs"></div>
  <div class="sectionHead"><div><h2 id="sectionTitle"></h2><p id="sectionMeta"></p></div><div class="actions"><button class="btn primary" onclick="startSectionTest()">اختبار القسم كاملا</button><button class="btn" onclick="flashRandom()">بطاقات سريعة</button></div></div>
  <div id="wordGrid" class="grid"></div>
</div>

<div id="flashOverlay" class="overlay"><div class="modal">
  <div class="sectionHead"><div><h3>بطاقة الكلمة</h3><span class="muted" id="flashMeta"></span></div><button class="btn" onclick="closeFlash()">إغلاق</button></div>
  <div id="flashWord" class="flashword"></div><div id="flashMeaning" class="answerline"></div>
  <div id="flashExample" class="example"></div><p id="flashExampleAr" class="muted center"></p>
  <div class="flashactions"><button class="btn primary" onclick="speakCurrent()">🔊 اسمع</button><button class="btn" onclick="speakCurrent(true)">🐢 ببطء</button><button class="btn green" onclick="markCurrentMastered()">✓ أتقنتها</button><button id="flashStar" class="btn" onclick="toggleCurrentStar()">☆ مفضلة</button></div>
</div></div>

<div id="testOverlay" class="overlay"><div class="modal">
  <div id="testArea"></div>
</div></div>
<div id="toast" class="toast"></div>

function isMastered(id){return mastery(id)>=3}
function setMastery(id,n){state.mastery[id]=Math.max(0,Math.min(3,n));save()}
function updateStats(){const mastered=allWords.filter(x=>isMastered(x.id)).length;const weak=allWords.filter(x=>mastery(x.id)>0&&!isMastered(x.id)).length;const stars=allWords.filter(x=>state.stars[x.id]).length;const p=Math.round(mastered/allWords.length*100);document.getElementById('masteredCount').textContent=mastered;document.getElementById('weakCount').textContent=weak;document.getElementById('starCount').textContent=stars;document.getElementById('studyScore').textContent=state.stats.correct||0;document.getElementById('overallText').textContent=p+'%';document.getElementById('overallCount').textContent=mastered+' / '+allWords.length+' كلمة';document.getElementById('overallBar').style.width=p+'%'}
function renderTabs(){const el=document.getElementById('tabs');el.innerHTML=letters.map(L=>{const a=DATA[L];const p=Math.round(a.filter(x=>isMastered(L+'_'+a.indexOf(x))).length/a.length*100);return `<button class="tab ${L===state.currentLetter?'active':''}" onclick="selectLetter('${L}')">${L}<small>${p}%</small></button>`}).join('')}
function selectLetter(L){state.currentLetter=L;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){updateStats();renderTabs();renderWords()}
function filteredWords(){const q=state.search.trim().toLowerCase();return DATA[state.currentLetter].map((x,i)=>({...x,id:state.currentLetter+'_'+i,letter:state.currentLetter})).filter(x=>{const m=mastery(x.id);if(state.filter==='unmastered'&&isMastered(x.id))return false;if(state.filter==='mastered'&&!isMastered(x.id))return false;if(state.filter==='weak'&&!(m>0&&!isMastered(x.id)))return false;if(state.filter==='starred'&&!state.stars[x.id])return false;if(!q)return true;return [x.word,x.translation,x.example,x.exampleAr].join(' ').toLowerCase().includes(q)})}
function renderWords(){const L=state.currentLetter;const arr=DATA[L];const mastered=arr.filter((x,i)=>isMastered(L+'_'+i)).length;document.getElementById('sectionTitle').textContent='قسم حرف '+L;document.getElementById('sectionMeta').textContent=arr.length+' كلمة · '+mastered+' متقنة · '+Math.round(mastered/arr.length*100)+'% إنجاز';const list=filteredWords();document.getElementById('wordGrid').innerHTML=list.length?list.map(x=>{const m=mastery(x.id);return `<article class="card"><div class="wordtop"><div class="word">${esc(x.word)}</div><button class="star ${state.stars[x.id]?'on':''}" onclick="toggleStar('${x.id}')">${state.stars[x.id]?'★':'☆'}</button></div><div class="meaning">${esc(x.translation)}</div><div class="example">${esc(x.example)}</div><div class="progressmini"><i style="width:${m/3*100}%"></i></div><div class="cardfoot"><span class="tag ${isMastered(x.id)?'mastered':''}">${isMastered(x.id)?'متقنة 100%':'تقدم '+m+'/3'}</span><button class="btn" style="margin-right:auto;padding:7px 10px" onclick="openFlash('${x.id}')">تدريب</button></div></article>`}).join(''): '<div class="empty">لا توجد نتائج بهذا الفلتر. غيّر البحث أو الفلتر.</div>'}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function findWord(id){return allWords.find(x=>x.id===id)}
function toggleStar(id){state.stars[id]=!state.stars[id];save();renderWords();updateStats()}
function openFlash(id){currentFlash=id;const x=findWord(id);if(!x)return;document.getElementById('flashWord').textContent=x.word;document.getElementById('flashMeaning').textContent=x.translation;document.getElementById('flashExample').textContent=x.example;document.getElementById('flashExampleAr').textContent=x.exampleAr;document.getElementById('flashMeta').textContent='المستوى A1 · قسم '+x.letter+' · تقدم '+mastery(id)+'/3';document.getElementById('flashStar').textContent=state.stars[id]?'★ مفضلة':'☆ مفضلة';document.getElementById('flashOverlay').classList.add('show')}
function closeFlash(){document.getElementById('flashOverlay').classList.remove('show')}
function toggleCurrentStar(){if(currentFlash)toggleStar(currentFlash);openFlash(currentFlash)}
function markCurrentMastered(){if(!currentFlash)return;setMastery(currentFlash,3);toast('تم إتقان الكلمة');render();openFlash(currentFlash)}
function speak(text,slow=false){if(!('speechSynthesis'in window)){toast('النطق غير مدعوم في هذا المتصفح');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=slow?.55:.9;speechSynthesis.speak(u)}
function speakCurrent(slow=false){const x=findWord(currentFlash);if(x)speak(x.word,slow)}
function smartReview(){const weak=allWords.filter(x=>!isMastered(x.id)).sort((a,b)=>mastery(a.id)-mastery(b.id)||Math.random()-.5).slice(0,20);if(!weak.length){toast('ممتاز! كل كلمات A1 متقنة 🎉');return}startCustomTest(weak,'مراجعة ذكية')}
function flashRandom(){const arr=filteredWords();if(arr.length)openFlash(arr[Math.floor(Math.random()*arr.length)].id);else toast('لا توجد كلمات مطابقة')}
function startSectionTest(){const arr=DATA[state.currentLetter].map((x,i)=>({...x,id:state.currentLetter+'_'+i,letter:state.currentLetter}));startCustomTest(arr,'اختبار قسم '+state.currentLetter)}
function startCustomTest(words,title){if(!words.length)return;test={words:shuffle(words),index:0,correct:0,wrong:[],title:title,locked:false};document.getElementById('testOverlay').classList.add('show');renderQuestion()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderQuestion(){const t=test;if(t.index>=t.words.length){renderResult();return}const x=t.words[t.index];const type=t.index%3;let prompt,choices=[];if(type===0){prompt=x.word;choices=shuffle([x.translation,...randomOther(x,'translation',3)]).map(v=>({text:v,correct:v===x.translation}));}else if(type===1){prompt=x.translation;choices=shuffle([x.word,...randomOther(x,'word',3)]).map(v=>({text:v,correct:v===x.word}));}else{const answer=x.word;prompt=x.example.replace(new RegExp('\\b'+escapeRe(answer)+'\\b','i'),'_____');choices=shuffle([answer,...randomOther(x,'word',3)]).map(v=>({text:v,correct:v===answer}))}test.correctAnswer=choices.findIndex(c=>c.correct);document.getElementById('testArea').innerHTML=`<div class="qhead"><span>${esc(t.title)}</span><span>${t.index+1} / ${t.words.length}</span></div><h3>اختبر استرجاعك</h3><div class="question">${esc(prompt)}</div><div class="choices">${choices.map((c,i)=>`<div><button class="choice" onclick="answerQuestion(${i})">${esc(c.text)}</button></div>`).join('')}</div><div id="feedback" class="feedback"></div><div id="nextAction" class="actions" style="justify-content:center;min-height:0"><button class="btn" onclick="closeTest()">إنهاء الاختبار</button></div>`}
function randomOther(x,key,n){return shuffle(allWords.filter(y=>y.id!==x.id).map(y=>y[key]).filter(Boolean)).slice(0,n)}
function escapeRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function answerQuestion(i){if(test.locked)return;test.locked=true;const ok=i===test.correctAnswer;const x=test.words[test.index];const buttons=[...document.querySelectorAll('.choice')];buttons.forEach((b,k)=>{if(k===test.correctAnswer)b.classList.add('correct');if(k===i&&!ok)b.classList.add('wrong');b.disabled=true});const f=document.getElementById('feedback');const action=document.getElementById('nextAction');if(ok){test.correct++;testStep(x,true);f.textContent='إجابة صحيحة ✅';f.style.color='#52e2b5';setTimeout(()=>{test.index++;test.locked=false;renderQuestion()},550)}else{test.wrong.push(x);testStep(x,false);const selected=buttons[i];const wrap=selected?.parentElement;if(wrap){const explanation=document.createElement('div');explanation.className='choice-explanation';explanation.innerHTML='<strong>التفسير:</strong> '+esc(x.translation)+'<br><span>'+esc(x.example)+'</span><br><span>'+esc(x.exampleAr)+'</span>';wrap.appendChild(explanation)}f.textContent='إجابة غير صحيحة ❌';f.style.color='#ff8c9b';action.insertAdjacentHTML('afterbegin',`<button id="nextQuestionBtn" class="btn primary" onclick="nextQuestion()">التالي ←</button>`);test.locked=true}}
function nextQuestion(){if(!test||!test.locked)return;test.index++;test.locked=false;renderQuestion()}
function testStep(x,ok){state.stats.answered=(state.stats.answered||0)+1;if(ok){state.stats.correct=(state.stats.correct||0)+1;setMastery(x.id,mastery(x.id)+1)}else{setMastery(x.id,0)}save();updateStats()}
function renderResult(){const t=test;const pct=Math.round(t.correct/t.words.length*100);const wrong=t.wrong;document.getElementById('testArea').innerHTML=`<div class="center"><div class="eyebrow">انتهى الاختبار</div><h3>${esc(t.title)}</h3><div class="result"><div class="stat"><b>${pct}%</b><span>النتيجة</span></div><div class="stat"><b>${t.correct}</b><span>صحيح</span></div><div class="stat"><b>${wrong.length}</b><span>يحتاج إعادة</span></div></div><p class="muted">كل كلمة لا تثبت إلا بعد 3 إجابات صحيحة متتالية. الكلمات الخاطئة تعود إلى مستوى 0 حتى لا يكون الإتقان وهميًا.</p><div class="actions" style="justify-content:center"><button class="btn green" onclick="closeTest();render();">حفظ والخروج</button>${wrong.length?`<button class="btn primary" onclick='retryWrong()'>إعادة أخطائي فقط (${wrong.length})</button>`:''}</div></div>`}
function retryWrong(){const w=test.wrong;closeTest();startCustomTest(w,'إعادة الكلمات الخاطئة')}
function closeTest(){document.getElementById('testOverlay').classList.remove('show');test=null;render()}
function resetAll(){if(!confirm('هل تريد حذف جميع التقدم والنجوم والنتائج؟'))return;state={mastery:{},stars:{},stats:{correct:0,answered:0},currentLetter:state.currentLetter,filter:'all',search:''};try{localStorage.removeItem(KEY)}catch(e){}try{sessionStorage.removeItem(KEY)}catch(e){}document.getElementById('search').value='';document.getElementById('filter').value='all';render();toast('تم تصفير التقدم')}
document.getElementById('search').addEventListener('input',e=>{state.search=e.target.value;renderWords()});document.getElementById('filter').addEventListener('change',e=>{state.filter=e.target.value;renderWords()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeFlash();closeTest()}});
load();render();
</script>
</body></html>
